<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - P.E.P. Ajedrez</title>
    <style>
        :root {
            --azul-principal: #0d6efd;
            --azul-oscuro: #0a0f1d;
            --blanco: #ffffff;
            --gris-borde: #cbd5e1;
            --texto-oscuro: #0f172a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .register-card {
            background: var(--blanco);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .logo { width: 70px; height: auto; margin-bottom: 12px; }

        h1 { font-size: 1.8rem; color: var(--texto-oscuro); font-weight: 800; margin-bottom: 4px; }
        p.subtitle { color: #64748b; font-size: 0.9rem; margin-bottom: 24px; }

        .form-group { text-align: left; margin-bottom: 16px; }
        label { display: block; font-weight: 700; font-size: 0.88rem; color: var(--texto-oscuro); margin-bottom: 6px; }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid var(--gris-borde);
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s ease;
        }

        input:focus { border-color: var(--azul-principal); }

        .btn-submit {
            width: 100%;
            background: var(--azul-principal);
            color: var(--blanco);
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s ease;
        }

        .btn-submit:hover { background: #0b5ed7; }
    </style>
</head>
<body>

    <div class="register-card">
        <img src="logo-colegio.jpg" alt="Logo P.E.P." class="logo">
        <h1>Únete a P.E.P. Ajedrez</h1>
        <p class="subtitle">Crea tu cuenta e intégrate a la tabla general</p>

        <form id="registerForm">
            <div class="form-group">
                <label for="username">Nombre de la cuenta</label>
                <input type="text" id="username" required>
            </div>

            <div class="form-group">
                <label for="age">Edad</label>
                <input type="number" id="age" min="5" max="100" required>
            </div>

            <div class="form-group">
                <label for="location">País y departamento</label>
                <input type="text" id="location" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" required>
            </div>

            <button type="submit" class="btn-submit">Crear Cuenta</button>
        </form>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Guardar datos del usuario
            const user = {
                username: document.getElementById('username').value,
                age: document.getElementById('age').value,
                location: document.getElementById('location').value,
            };

            localStorage.setItem('pep_user', JSON.stringify(user));

            // Redirigir al inicio
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
