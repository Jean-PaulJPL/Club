<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P.E.P. - Aperturas</title>
    <style>
        :root { 
            --azul-principal: #0d6efd; 
            --azul-hover: #00b4d8;
            --azul-oscuro: #0a192f; 
            --azul-marino: #0f172a;
            --sidebar-bg: #161f33;
            --sidebar-hover: #222e48;
            --blanco: #ffffff; 
            --gris-fondo: #e2e8f0;
            --gris-borde: #cbd5e1;
            --texto-oscuro: #0f172a;
            --sidebar-width: 175px;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }

        body { 
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%); 
            color: var(--texto-oscuro); 
            line-height: 1.6; 
            min-height: 100vh;
            display: flex;
        }

        /* SIDEBAR COMPACTO ESTILO CHESS.COM */
        aside.sidebar {
            width: var(--sidebar-width);
            background-color: var(--sidebar-bg);
            height: 100vh;
            position: fixed; 
            top: 0; 
            left: 0;
            display: flex; 
            flex-direction: column;
            padding: 1rem 0.6rem;
            box-shadow: 2px 0 15px rgba(0, 0, 0, 0.15);
            z-index: 100;
        }

        .sidebar-brand { 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            padding-bottom: 1rem; 
            margin-bottom: 0.8rem; 
            padding-left: 0.4rem; 
            border-bottom: 1px solid rgba(255, 255, 255, 0.08); 
        }

        .sidebar-brand img { 
            width: 30px; 
            height: auto; 
            border-radius: 6px; 
        }

        .sidebar-brand h2 { 
            color: #ffffff; 
            font-size: 1.1rem; 
            font-weight: 800; 
            letter-spacing: 0.5px; 
        }

        nav.sidebar-nav { 
            display: flex; 
            flex-direction: column; 
            gap: 4px; 
            flex-grow: 1; 
        }

        nav.sidebar-nav a { 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            color: #94a3b8; 
            text-decoration: none; 
            padding: 8px 12px; 
            border-radius: 8px; 
            font-weight: 700; 
            font-size: 0.85rem; 
            transition: all 0.2s ease; 
        }

        nav.sidebar-nav a:hover { 
            background-color: var(--sidebar-hover); 
            color: #ffffff; 
        }

        nav.sidebar-nav a.active { 
            background-color: var(--azul-principal); 
            color: #ffffff; 
            box-shadow: 0 2px 8px rgba(13, 110, 253, 0.3); 
        }

        .sidebar-nav .icon { 
            font-size: 1rem; 
            width: 18px; 
            text-align: center; 
        }

        .sidebar-footer { 
            padding-top: 0.8rem; 
            border-top: 1px solid rgba(255, 255, 255, 0.08); 
            color: #64748b; 
            font-size: 0.68rem; 
            text-align: center; 
        }

        /* CONTENIDO PRINCIPAL ADAPTADO AL SIDEBAR */
        main.main-content {
            margin-left: var(--sidebar-width);
            flex-grow: 1;
            padding: 2.5rem 2rem;
            min-height: 100vh;
        }

        .container { 
            max-width: 900px; 
            margin: 0 auto; 
        }

        /* BANNER TITULO SUPERIOR */
        .page-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .page-header h1 {
            font-size: 2.2rem;
            color: var(--azul-oscuro);
            font-weight: 800;
        }

        /* TARJETAS MODERNAS */
        .card { 
            background: var(--blanco); 
            padding: 2.5rem; 
            border-radius: 20px; 
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.05); 
            border: 1px solid var(--gris-borde);
            margin-bottom: 2rem;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, #0d6efd, #00d2ff);
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(13, 110, 253, 0.08);
        }

        .card h2 { 
            color: var(--azul-oscuro); 
            margin-bottom: 1.2rem; 
            font-size: 1.6rem;
            font-weight: 800;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 0.8rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card p {
            color: #475569;
            font-size: 1.05rem;
        }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            aside.sidebar { width: 100%; height: auto; position: relative; }
            main.main-content { margin-left: 0; padding: 1.2rem; }
        }
    </style>
</head>
<body>

    <!-- SIDEBAR ESTILO CHESS.COM -->
    <aside class="sidebar">
        <div class="sidebar-brand">
            <img src="logo-colegio.jpg" alt="Logo P.E.P.">
            <h2>P.E.P.</h2>
        </div>
        <nav class="sidebar-nav">
            <a href="index.html"><span class="icon">🏠</span> Inicio</a>
            <a href="datos.html"><span class="icon">📋</span> Datos</a>
            <a href="aperturas.html" class="active"><span class="icon">📖</span> Aperturas</a>
            <a href="torneo.html"><span class="icon">🏆</span> Torneo</a>
            <a href="clasificacion.html"><span class="icon">📊</span> Estadísticas</a>
        </nav>
        <div class="sidebar-footer">
            <p>&copy; 2026 SDA Ajedrez</p>
        </div>
    </aside>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="main-content">
        <div class="container">
            
            <div class="page-header">
                <h1>📖 Aperturas de Ajedrez</h1>
            </div>

            <section class="card">
                <h2>♟️ Repertorios de Entrenamiento</h2>
                <p>Sección en desarrollo. Próximamente compartiremos aperturas y estrategias clave con blancas y negras para el equipo.</p>
            </section>

        </div>
    </main>

</body>
</html>
