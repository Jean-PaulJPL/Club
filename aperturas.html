<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P.E.P. - Aperturas</title>
    <style>
        :root { 
            --azul-principal: #0d6efd; 
            --azul-oscuro: #030712; 
            --azul-marino: #0f172a;
            --azul-light: #eef6ff;
            --blanco: #ffffff; 
            --gris-borde: #e2e8f0;
            --texto-oscuro: #0f172a;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }

        body { 
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%); 
            color: var(--texto-oscuro); 
            line-height: 1.6; 
            min-height: 100vh;
        }

        /* HEADER UNIFICADO */
        header { 
            background: rgba(255, 255, 255, 0.95); 
            backdrop-filter: blur(10px);
            border-bottom: 3px solid var(--azul-principal); 
            padding: 0.8rem 5%; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            position: sticky; 
            top: 0; 
            z-index: 100; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }

        .logo-container { 
            display: flex; 
            align-items: center; 
            gap: 12px; 
        }

        .logo-img { 
            height: 50px; 
            width: auto; 
            object-fit: contain; 
        }

        nav a { 
            color: var(--azul-oscuro); 
            text-decoration: none; 
            margin-left: 20px; 
            font-weight: 700; 
            transition: all 0.3s ease;
            padding: 6px 14px;
            border-radius: 8px;
        }

        nav a.active, nav a:hover { 
            color: var(--azul-principal); 
            background: var(--azul-light);
        }

        .container { 
            max-width: 900px; 
            margin: 3rem auto; 
            padding: 0 20px; 
            min-height: calc(100vh - 230px);
        }

        .page-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .page-header h1 {
            font-size: 2.2rem;
            color: var(--azul-oscuro);
            font-weight: 800;
        }

        .card { 
            background: var(--blanco); 
            padding: 2.5rem; 
            border-radius: 20px; 
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.05); 
            border: 1px solid var(--gris-borde);
            margin-bottom: 2rem;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, #0d6efd, #00d2ff);
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(13, 110, 253, 0.08);
        }

        .card h2 { 
            color: var(--azul-oscuro); 
            margin-bottom: 1.2rem; 
            font-size: 1.6rem;
            font-weight: 800;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 0.8rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card p {
            color: #475569;
            font-size: 1.05rem;
        }

        footer { 
            text-align: center; 
            padding: 1.8rem; 
            background-color: var(--azul-oscuro); 
            color: var(--blanco); 
            font-size: 0.9rem; 
            margin-top: 3rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="logo-colegio.jpg" alt="Logo Club P.E.P." class="logo-img">
            <h2>P.E.P.</h2>
        </div>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="datos.html">Datos</a>
            <a href="aperturas.html" class="active">Aperturas</a>
            <a href="torneo.html">Torneo</a>
            <a href="clasificacion.html">Estadísticas</a>
        </nav>
    </header>

    <div class="container">
        
        <div class="page-header">
            <h1>📖 Aperturas de Ajedrez</h1>
        </div>

        <section class="card">
            <h2>♟️ Repertorios de Entrenamiento</h2>
            <p>Sección en desarrollo. Próximamente compartiremos aperturas y estrategias clave con blancas y negras para el equipo.</p>
        </section>

    </div>

    <footer>
        <p>&copy; 2026 Club de Ajedrez P.E.P. - Colegio Santo Domingo, el Apóstol</p>
    </footer>

</body>
</html>
